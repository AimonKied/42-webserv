# Python CGI demo. Run from the repository root: ./webserv config/cgi.conf
server {
    listen 0.0.0.0:8080;
    server_name localhost;
    client_max_body_size 1048576;
    root ./www;
    location / {
        index index.html;
        allow_methods GET POST;
        cgi_extension .py;
    }
}
server {
    listen 0.0.0.0:8081;
    server_name localhost;
    client_max_body_size 1048576;
    root ./www;
    location / {
        index index.html;
        allow_methods GET POST;
        cgi_extension .py;
    }
}
